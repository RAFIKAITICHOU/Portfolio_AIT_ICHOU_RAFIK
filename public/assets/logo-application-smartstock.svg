<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="stockBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#1C2541" />
      <stop offset="100%" stop-color="#080E21" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="stShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#stockBg)" />
  <circle cx="220" cy="140" r="180" fill="#3B82F6" opacity="0.18" />
  <circle cx="620" cy="300" r="160" fill="#60A5FA" opacity="0.14" />

  <!-- Main SmartStock Card -->
  <g transform="translate(130, 65)" filter="url(#stShadow)">
    <rect width="540" height="295" rx="18" fill="#111B38" stroke="#3B82F6" stroke-width="1.8" stroke-opacity="0.45" />

    <!-- Top window dots -->
    <g transform="translate(24, 22)">
      <circle cx="0" cy="0" r="5" fill="#EF4444" />
      <circle cx="15" cy="0" r="5" fill="#F59E0B" />
      <circle cx="30" cy="0" r="5" fill="#10B981" />
      <rect x="52" y="-10" width="310" height="20" rx="10" fill="#0A1126" stroke="#1E305C" stroke-width="1" />
      <text x="207" y="4" font-family="monospace" font-size="9.5" fill="#93C5FD" text-anchor="middle">smartstock://inventory/iot-gateway</text>
    </g>

    <!-- Brand Header -->
    <g transform="translate(28, 56)">
      <rect width="44" height="44" rx="10" fill="url(#blueGlow)" />
      <!-- Warehouse Box & QR icon -->
      <path d="M12,20 L22,14 L32,20 L22,26 Z" fill="#FFFFFF" />
      <path d="M12,20 L22,26 L22,34 L12,28 Z" fill="#93C5FD" />
      <path d="M32,20 L22,26 L22,34 L32,28 Z" fill="#60A5FA" />

      <text x="56" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
        SmartStock Logistics
      </text>
      <text x="56" y="38" font-family="sans-serif" font-size="10" font-weight="700" fill="#93C5FD" letter-spacing="1">
        GESTION D'ENTREPÔT INTELLIGENTE &amp; TRAÇABILITÉ QR CODE
      </text>
    </g>

    <!-- Logistics Grid -->
    <g transform="translate(28, 122)">
      <!-- Left QR / Scanner Mockup -->
      <rect width="210" height="136" rx="10" fill="#0A1126" stroke="#1E2F5E" stroke-width="1.2" />
      <g transform="translate(45, 18)" stroke="#60A5FA" stroke-width="2" fill="none">
        <rect x="0" y="0" width="32" height="32" rx="4" />
        <rect x="6" y="6" width="20" height="20" fill="#60A5FA" />
        <rect x="88" y="0" width="32" height="32" rx="4" />
        <rect x="94" y="6" width="20" height="20" fill="#60A5FA" />
        <rect x="0" y="68" width="32" height="32" rx="4" />
        <rect x="6" y="74" width="20" height="20" fill="#60A5FA" />
        <line x1="-15" y1="50" x2="135" y2="50" stroke="#EF4444" stroke-width="2.5" />
      </g>

      <!-- Right stats -->
      <g transform="translate(230, 0)">
        <rect width="254" height="62" rx="10" fill="#132147" stroke="#253A70" stroke-width="1" />
        <text x="14" y="22" font-family="sans-serif" font-size="9" font-weight="700" fill="#93C5FD">ROTATION DES STOCKS</text>
        <text x="14" y="48" font-family="monospace" font-size="20" font-weight="900" fill="#FFFFFF">Temps Réel <tspan font-size="11" fill="#34D399">Live</tspan></text>

        <g transform="translate(0, 74)">
          <rect width="254" height="62" rx="10" fill="#132147" stroke="#253A70" stroke-width="1" />
          <text x="14" y="22" font-family="sans-serif" font-size="9" font-weight="700" fill="#FCD34D">ALERTES RUPTURE</text>
          <text x="14" y="48" font-family="monospace" font-size="18" font-weight="900" fill="#FFFFFF">Automatisées <tspan font-size="11" fill="#F59E0B">SMS/Mail</tspan></text>
        </g>
      </g>
    </g>
  </g>

  <!-- Floating badge -->
  <g transform="translate(50, 185)" filter="url(#stShadow)">
    <rect width="135" height="48" rx="12" fill="#0A1126" stroke="#3B82F6" stroke-width="1.5" />
    <text x="24" y="22" font-family="sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">SCAN RAPIDE</text>
    <text x="24" y="36" font-family="sans-serif" font-size="8.5" font-weight="600" fill="#60A5FA">QR &amp; Code-barres</text>
  </g>
</svg>
