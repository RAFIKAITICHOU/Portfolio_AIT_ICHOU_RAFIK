<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="absensBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05161A" />
      <stop offset="50%" stop-color="#092A30" />
      <stop offset="100%" stop-color="#031114" />
    </linearGradient>

    <!-- Cyan Teal Accent -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Emerald Success -->
    <linearGradient id="ensEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Card Dark Gradient -->
    <linearGradient id="absensGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E333A" />
      <stop offset="100%" stop-color="#071E22" />
    </linearGradient>

    <filter id="aGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="aShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="450" fill="url(#absensBg)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="130" r="190" fill="#0EA5E9" opacity="0.20" filter="url(#aGlow)" />
  <circle cx="640" cy="310" r="170" fill="#10B981" opacity="0.16" filter="url(#aGlow)" />

  <!-- Grid Pattern -->
  <g opacity="0.06" stroke="#06B6D4" stroke-width="1.2" fill="none">
    <pattern id="absensGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" />
    </pattern>
    <rect width="800" height="450" fill="url(#absensGrid)" />
  </g>

  <!-- Central Academic Management Card -->
  <g transform="translate(130, 65)" filter="url(#aShadow)">
    <rect width="540" height="295" rx="18" fill="url(#absensGlass)" stroke="#0EA5E9" stroke-width="1.8" stroke-opacity="0.4" />

    <!-- Top Window Chrome -->
    <g transform="translate(24, 20)">
      <circle cx="0" cy="0" r="5" fill="#EF4444" />
      <circle cx="16" cy="0" r="5" fill="#F59E0B" />
      <circle cx="32" cy="0" r="5" fill="#10B981" />
      <rect x="58" y="-9" width="320" height="18" rx="9" fill="#041B1F" stroke="#124E5B" stroke-width="1" />
      <text x="218" y="4" font-family="monospace" font-size="9" fill="#7DD3FC" text-anchor="middle">absens.ens-marrakech.ac.ma/portail-professeurs</text>
    </g>

    <!-- Brand Header Row -->
    <g transform="translate(28, 54)">
      <!-- ENS Icon Badge -->
      <rect width="48" height="48" rx="12" fill="url(#tealGrad)" />
      <!-- Academic Cap / Checkmark motif inside -->
      <g transform="translate(24, 24)">
        <polygon points="0,-12 14,-5 0,2 -14,-5" fill="#FFFFFF" />
        <path d="M -9,-3 L -9,7 C -9,11 9,11 9,7 L 9,-3" fill="none" stroke="#FFFFFF" stroke-width="1.8" />
        <circle cx="14" cy="2" r="2.5" fill="#FCD34D" />
      </g>

      <text x="62" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" letter-spacing="-0.02em">absENS</text>
      <text x="62" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#7DD3FC">Gestion d'Assiduité Universitaire — ENS Marrakech</text>

      <!-- Badge Stage Technique -->
      <rect x="365" y="8" width="112" height="24" rx="12" fill="rgba(16, 185, 129, 0.16)" stroke="#10B981" stroke-width="1" />
      <text x="421" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="800" fill="#34D399" text-anchor="middle">STAGE 6 MOIS</text>
    </g>

    <!-- Feature Row: QR Attendance, Spring Boot, Audit -->
    <g transform="translate(28, 122)">
      <!-- Box 1: Emargement QR Dynamique -->
      <g transform="translate(0, 0)">
        <rect width="150" height="90" rx="10" fill="#041B1F" stroke="#124E5B" stroke-width="1" />
        <text x="14" y="24" font-family="sans-serif" font-size="10" font-weight="800" fill="#38BDF8">ÉMARGEMENT QR</text>
        <text x="14" y="44" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Scan Mobile</text>
        <text x="14" y="64" font-family="sans-serif" font-size="10" fill="#94A3B8">Validation &lt; 2 secondes</text>
        <circle cx="132" cy="22" r="4" fill="#10B981" />
      </g>

      <!-- Box 2: Spring Boot & Angular -->
      <g transform="translate(166, 0)">
        <rect width="150" height="90" rx="10" fill="#041B1F" stroke="#124E5B" stroke-width="1" />
        <text x="14" y="24" font-family="sans-serif" font-size="10" font-weight="800" fill="#34D399">STACK FULL-STACK</text>
        <text x="14" y="44" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Spring + Angular</text>
        <text x="14" y="64" font-family="sans-serif" font-size="10" fill="#94A3B8">PostgreSQL &amp; JWT</text>
        <circle cx="132" cy="22" r="4" fill="#38BDF8" />
      </g>

      <!-- Box 3: Exports & Délibérations -->
      <g transform="translate(332, 0)">
        <rect width="150" height="90" rx="10" fill="#041B1F" stroke="#124E5B" stroke-width="1" />
        <text x="14" y="24" font-family="sans-serif" font-size="10" font-weight="800" fill="#FBBF24">RAPPORTS &amp; AUDIT</text>
        <text x="14" y="44" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Exports PDF/XLS</text>
        <text x="14" y="64" font-family="sans-serif" font-size="10" fill="#94A3B8">Alertes aux tuteurs</text>
        <circle cx="132" cy="22" r="4" fill="#F59E0B" />
      </g>
    </g>

    <!-- Bottom Strip -->
    <g transform="translate(28, 230)">
      <line x1="0" y1="0" x2="484" y2="0" stroke="#124E5B" stroke-width="1" />
      <text x="0" y="26" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#E2E8F0">1 200+ Étudiants suivis</text>
      <text x="170" y="26" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#E2E8F0">Zéro Feuille Papier</text>
      <text x="340" y="26" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#E2E8F0">Département Informatique</text>
    </g>
  </g>
</svg>

