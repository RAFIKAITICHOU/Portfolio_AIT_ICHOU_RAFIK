<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ringBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140A1E" />
      <stop offset="50%" stop-color="#241238" />
      <stop offset="100%" stop-color="#0E0516" />
    </linearGradient>

    <!-- Violet/Rose Gold Gradient -->
    <linearGradient id="violetRose" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Gold Accent -->
    <linearGradient id="ringGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>

    <!-- Card Dark Gradient -->
    <linearGradient id="ringGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B1542" />
      <stop offset="100%" stop-color="#190B28" />
    </linearGradient>

    <filter id="rGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="rShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="450" fill="url(#ringBg)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="130" r="190" fill="#8B5CF6" opacity="0.22" filter="url(#rGlow)" />
  <circle cx="640" cy="310" r="170" fill="#EC4899" opacity="0.18" filter="url(#rGlow)" />

  <!-- Circular Radar / Reticle Grid Pattern -->
  <g opacity="0.06" stroke="#C084FC" stroke-width="1.2" fill="none">
    <pattern id="ringGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" />
    </pattern>
    <rect width="800" height="450" fill="url(#ringGrid)" />
  </g>

  <!-- Central AR Precision Mockup Card -->
  <g transform="translate(130, 65)" filter="url(#rShadow)">
    <rect width="540" height="295" rx="18" fill="url(#ringGlass)" stroke="#A855F7" stroke-width="1.8" stroke-opacity="0.4" />

    <!-- Window Chrome -->
    <g transform="translate(24, 20)">
      <circle cx="0" cy="0" r="5" fill="#EF4444" />
      <circle cx="16" cy="0" r="5" fill="#F59E0B" />
      <circle cx="32" cy="0" r="5" fill="#10B981" />
      <rect x="58" y="-9" width="320" height="18" rx="9" fill="#140822" stroke="#3F1D68" stroke-width="1" />
      <text x="218" y="4" font-family="monospace" font-size="9" fill="#E9D5FF" text-anchor="middle">flutter://ring-sizer.ar/sensor/optical-calibration</text>
    </g>

    <!-- Brand Header Row -->
    <g transform="translate(28, 54)">
      <!-- Ring AR Icon Badge -->
      <rect width="48" height="48" rx="12" fill="url(#violetRose)" />
      <!-- Stylized Ring & Crosshair Reticle -->
      <g transform="translate(24, 24)">
        <circle cx="0" cy="0" r="13" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
        <circle cx="0" cy="0" r="9" fill="none" stroke="url(#ringGold)" stroke-width="1.5" stroke-dasharray="3,2" />
        <line x1="-16" y1="0" x2="-11" y2="0" stroke="#FFFFFF" stroke-width="1.5" />
        <line x1="11" y1="0" x2="16" y2="0" stroke="#FFFFFF" stroke-width="1.5" />
        <line x1="0" y1="-16" x2="0" y2="-11" stroke="#FFFFFF" stroke-width="1.5" />
        <line x1="0" y1="11" x2="0" y2="16" stroke="#FFFFFF" stroke-width="1.5" />
        <circle cx="0" cy="-13" r="3" fill="#FCD34D" />
      </g>

      <text x="62" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" letter-spacing="-0.02em">Ring Sizer AR</text>
      <text x="62" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#E9D5FF">Calibration Optique &amp; Mesure de Bague en Temps Réel</text>

      <!-- Badge Precision -->
      <rect x="365" y="8" width="112" height="24" rx="12" fill="rgba(236, 72, 153, 0.16)" stroke="#EC4899" stroke-width="1" />
      <text x="421" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="800" fill="#F472B6" text-anchor="middle">±0.1 MM PRÉCISION</text>
    </g>

    <!-- AR Measurement Reticle & Standards inside Card -->
    <g transform="translate(28, 122)">
      <!-- Box 1: Visual Sensor Calibration -->
      <g transform="translate(0, 0)">
        <rect width="150" height="90" rx="10" fill="#160926" stroke="#3F1D68" stroke-width="1" />
        <text x="14" y="24" font-family="sans-serif" font-size="10" font-weight="800" fill="#C084FC">CALIBRATION CAPTEUR</text>
        <text x="14" y="44" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Optical Scale</text>
        <text x="14" y="64" font-family="sans-serif" font-size="10" fill="#94A3B8">Compensateur d'angle</text>
        <circle cx="132" cy="22" r="4" fill="#34D399" />
      </g>

      <!-- Box 2: International Sizing Standards -->
      <g transform="translate(166, 0)">
        <rect width="150" height="90" rx="10" fill="#160926" stroke="#3F1D68" stroke-width="1" />
        <text x="14" y="24" font-family="sans-serif" font-size="10" font-weight="800" fill="#F472B6">NORMES MONDIALES</text>
        <text x="14" y="44" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">US, EU, UK &amp; JP</text>
        <text x="14" y="64" font-family="sans-serif" font-size="10" fill="#94A3B8">Conversion instantanée</text>
        <circle cx="132" cy="22" r="4" fill="#F59E0B" />
      </g>

      <!-- Box 3: Flutter Mobile Engine -->
      <g transform="translate(332, 0)">
        <rect width="150" height="90" rx="10" fill="#160926" stroke="#3F1D68" stroke-width="1" />
        <text x="14" y="24" font-family="sans-serif" font-size="10" font-weight="800" fill="#60A5FA">FLUTTER &amp; DART</text>
        <text x="14" y="44" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">60 FPS Fluide</text>
        <text x="14" y="64" font-family="sans-serif" font-size="10" fill="#94A3B8">iOS &amp; Android natif</text>
        <circle cx="132" cy="22" r="4" fill="#8B5CF6" />
      </g>
    </g>

    <!-- Bottom Strip -->
    <g transform="translate(28, 230)">
      <line x1="0" y1="0" x2="484" y2="0" stroke="#3F1D68" stroke-width="1" />
      <text x="0" y="26" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#E2E8F0">Précision optique 0.1mm</text>
      <text x="180" y="26" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#E2E8F0">100% Hors-ligne</text>
      <text x="350" y="26" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#E2E8F0">Architecture Modulaire</text>
    </g>
  </g>
</svg>
