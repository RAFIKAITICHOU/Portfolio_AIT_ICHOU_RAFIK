<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ecomBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180B1E" />
      <stop offset="50%" stop-color="#3B0764" />
      <stop offset="100%" stop-color="#100318" />
    </linearGradient>
    <linearGradient id="roseAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>
    <filter id="ecShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#ecomBg)" />
  <circle cx="200" cy="130" r="180" fill="#F43F5E" opacity="0.18" />
  <circle cx="620" cy="310" r="170" fill="#A855F7" opacity="0.16" />

  <!-- Central Card -->
  <g transform="translate(130, 65)" filter="url(#ecShadow)">
    <rect width="540" height="295" rx="18" fill="#1C0F2B" stroke="#F43F5E" stroke-width="1.8" stroke-opacity="0.45" />

    <!-- Top window dots -->
    <g transform="translate(24, 22)">
      <circle cx="0" cy="0" r="5" fill="#EF4444" />
      <circle cx="15" cy="0" r="5" fill="#F59E0B" />
      <circle cx="30" cy="0" r="5" fill="#10B981" />
      <rect x="52" y="-10" width="310" height="20" rx="10" fill="#11071B" stroke="#3D184E" stroke-width="1" />
      <text x="207" y="4" font-family="monospace" font-size="9.5" fill="#F472B6" text-anchor="middle">https://oneclick-store.com/checkout</text>
    </g>

    <!-- Brand Header -->
    <g transform="translate(28, 56)">
      <rect width="44" height="44" rx="10" fill="url(#roseAccent)" />
      <!-- Shopping Bag & Lightning Icon -->
      <path d="M14,18 L30,18 L32,34 L12,34 Z" fill="#FFFFFF" />
      <path d="M18,18 C18,14 26,14 26,18" stroke="#F43F5E" stroke-width="2.5" fill="none" />
      <polygon points="23,22 20,28 24,28 21,34 26,27 22,27" fill="#F59E0B" />

      <text x="56" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
        One-Click E-Commerce
      </text>
      <text x="56" y="38" font-family="sans-serif" font-size="10" font-weight="700" fill="#F472B6" letter-spacing="1">
        PLATEFORME MULTI-BOUTIQUES &amp; PAIEMENT RAPIDE • LARAVEL &amp; RBAC
      </text>
    </g>

    <!-- Content Row -->
    <g transform="translate(28, 122)">
      <!-- Left Cart / Product Mockup -->
      <rect width="210" height="136" rx="10" fill="#12071D" stroke="#38154B" stroke-width="1.2" />
      <rect x="18" y="18" width="174" height="42" rx="8" fill="#251039" />
      <circle cx="38" cy="39" r="14" fill="#F43F5E" opacity="0.3" />
      <text x="60" y="36" font-family="sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">Produit Premium</text>
      <text x="60" y="48" font-family="monospace" font-size="9" fill="#F472B6">1-Click Express ✓</text>

      <rect x="18" y="74" width="174" height="44" rx="10" fill="url(#roseAccent)" />
      <text x="105" y="101" font-family="sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">COMMANDER EN 1 CLIC ⚡</text>

      <!-- Right stats -->
      <g transform="translate(230, 0)">
        <rect width="254" height="62" rx="10" fill="#220E34" stroke="#481869" stroke-width="1" />
        <text x="14" y="22" font-family="sans-serif" font-size="9" font-weight="700" fill="#F472B6">CONVERSION PANIER</text>
        <text x="14" y="48" font-family="monospace" font-size="20" font-weight="900" fill="#FFFFFF">+38% <tspan font-size="11" fill="#34D399">Optimisé</tspan></text>

        <g transform="translate(0, 74)">
          <rect width="254" height="62" rx="10" fill="#220E34" stroke="#481869" stroke-width="1" />
          <text x="14" y="22" font-family="sans-serif" font-size="9" font-weight="700" fill="#FCD34D">SÉCURITÉ TRANSACTIONS</text>
          <text x="14" y="48" font-family="monospace" font-size="17" font-weight="900" fill="#FFFFFF">PCI-DSS / 2FA</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Floating badge -->
  <g transform="translate(50, 185)" filter="url(#ecShadow)">
    <rect width="135" height="48" rx="12" fill="#12071D" stroke="#F43F5E" stroke-width="1.5" />
    <text x="24" y="22" font-family="sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">1-CLIC ACHAT</text>
    <text x="24" y="36" font-family="sans-serif" font-size="8.5" font-weight="600" fill="#F472B6">Paiement Éclair</text>
  </g>
</svg>
