<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1128" />
      <stop offset="50%" stop-color="#001F54" />
      <stop offset="100%" stop-color="#034078" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="chequeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEFCFB" />
      <stop offset="100%" stop-color="#F3F4F6" />
    </linearGradient>

    <!-- Accent Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Emerald Security Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- Subtle Guilloche / Grid Pattern -->
  <g opacity="0.07" stroke="#38BDF8" stroke-width="1.2" fill="none">
    <circle cx="400" cy="225" r="340" />
    <circle cx="400" cy="225" r="270" stroke-dasharray="6,6" />
    <circle cx="400" cy="225" r="200" />
    <circle cx="400" cy="225" r="130" stroke-dasharray="4,4" />
    <path d="M0,0 L800,450 M800,0 L0,450" />
    <path d="M0,225 L800,225 M400,0 L400,450" stroke-dasharray="3,3" />
  </g>

  <!-- Cyan Ambient Light -->
  <circle cx="620" cy="120" r="180" fill="#0284C7" opacity="0.22" filter="url(#glow)" />
  <circle cx="160" cy="320" r="150" fill="#F59E0B" opacity="0.14" filter="url(#glow)" />

  <!-- Main Cheque Card Graphic -->
  <g transform="translate(140, 75)" filter="url(#shadow)">
    <!-- Cheque Body -->
    <rect width="520" height="270" rx="18" fill="url(#chequeGrad)" stroke="#E2E8F0" stroke-width="2" />
    
    <!-- Top Cheque Security Bar -->
    <rect width="520" height="12" rx="6" fill="url(#goldGrad)" />
    
    <!-- Left Guilloche Security Band -->
    <rect x="22" y="28" width="8" height="220" rx="4" fill="#0284C7" opacity="0.3" />
    <rect x="36" y="28" width="3" height="220" rx="1.5" fill="#F59E0B" opacity="0.4" />

    <!-- Brand Header inside Cheque -->
    <g transform="translate(60, 48)">
      <!-- Shield Icon -->
      <path d="M0,6 L18,0 L36,6 C36,22 18,34 18,34 C18,34 0,22 0,6 Z" fill="url(#emeraldGrad)" />
      <path d="M12,16 L16,20 L25,11" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      
      <!-- Text: MesChèques -->
      <text x="48" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#0F172A" letter-spacing="-0.5">
        MesChèques
      </text>
      <!-- Arabic: شيكاتي -->
      <text x="175" y="20" font-family="'Traditional Arabic', 'Segoe UI', Tahoma, sans-serif" font-size="22" font-weight="bold" fill="#D97706">
        (شيكاتي)
      </text>
      <text x="48" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1.2">
        MOBILE OFFLINE-FIRST • FLUTTER &amp; SQLITE
      </text>
    </g>

    <!-- Cheque Data Mock Lines -->
    <g transform="translate(60, 105)" stroke="#CBD5E1" stroke-width="1.8">
      <!-- Payee line -->
      <line x1="0" y1="12" x2="310" y2="12" />
      <text x="0" y="4" font-family="sans-serif" font-size="9" font-weight="700" fill="#94A3B8" stroke="none">PAYER À L'ORDRE DE / ادفعوا لأمر</text>
      
      <!-- Amount box -->
      <rect x="330" y="-8" width="125" height="36" rx="8" fill="#F8FAFC" stroke="#0284C7" stroke-width="1.5" />
      <text x="342" y="16" font-family="monospace" font-size="14" font-weight="bold" fill="#0284C7" stroke="none">### 45 000 DH</text>
      
      <!-- Sum in words line -->
      <line x1="0" y1="46" x2="455" y2="46" stroke-dasharray="4,4" />
      <text x="0" y="38" font-family="sans-serif" font-size="9" font-weight="700" fill="#94A3B8" stroke="none">LA SOMME DE / مبلغ قدره</text>
    </g>

    <!-- Bottom MICR / Barcode Band -->
    <g transform="translate(60, 205)">
      <rect x="0" y="0" width="455" height="42" rx="8" fill="#0F172A" />
      <text x="24" y="26" font-family="monospace" font-size="13" font-weight="bold" fill="#38BDF8" letter-spacing="4">
        ⑆102938⑆ 0192837465019283 ⑈ 049
      </text>
      <!-- Offline-ready badge -->
      <g transform="translate(340, 10)">
        <rect width="95" height="22" rx="11" fill="url(#emeraldGrad)" />
        <text x="47" y="15" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">OFFLINE-FIRST</text>
      </g>
    </g>
  </g>

  <!-- Floating Badges -->
  <!-- Biometry Shield Badge (Left) -->
  <g transform="translate(65, 175)" filter="url(#shadow)">
    <rect width="130" height="48" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="28" cy="24" r="14" fill="#0284C7" opacity="0.3" />
    <path d="M28,14 C22,14 18,18 18,24 C18,30 22,34 28,34 C34,34 38,30 38,24" stroke="#38BDF8" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M28,18 C24,18 22,21 22,24 C22,27 24,30 28,30" stroke="#38BDF8" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <text x="52" y="21" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#FFFFFF">PIN + BIO</text>
    <text x="52" y="34" font-family="sans-serif" font-size="8.5" font-weight="600" fill="#94A3B8">Sécurité 100%</text>
  </g>

  <!-- 63 Tests Automated Badge (Right) -->
  <g transform="translate(615, 290)" filter="url(#shadow)">
    <rect width="135" height="48" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.5" />
    <circle cx="26" cy="24" r="14" fill="#10B981" opacity="0.25" />
    <path d="M20,24 L25,28 L33,19" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="48" y="21" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#FFFFFF">63 TESTS</text>
    <text x="48" y="34" font-family="sans-serif" font-size="8.5" font-weight="600" fill="#10B981">Automatisés</text>
  </g>
</svg>